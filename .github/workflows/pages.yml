# Deploy BotForge to GitHub Pages on every push to main.
# No secrets, no build step, no dependencies — it is a static site.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site (exclude repo metadata and tooling)
        run: |
          set -eu
          mkdir -p _site
          for f in index.html manifest.webmanifest sw.js robots.txt sitemap.xml .nojekyll LICENSE; do
            [ -f "$f" ] && cp "$f" _site/
          done
          cp -r assets _site/assets
          # sanity checks — fail loudly instead of deploying a broken site
          test -f _site/index.html
          test -f _site/assets/js/main.js
          test -f _site/assets/css/app.css
          echo "Staged $(find _site -type f | wc -l) files ($(du -sh _site | cut -f1))"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
